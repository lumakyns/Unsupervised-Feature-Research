program: src/separation/training.py
command:
  - ${env}
  - ${interpreter}
  - -m
  - src.separation.training
  - --config
  - src/separation/config.yaml

method: grid
metric:
  name: validation/accuracy
  goal: maximize

parameters:
  dataset:
    values: [cifar10]
  variant:
    values: [baseline, layer12, layer1234]
  model.channels:
    values:
      - [32, 64, 128, 256]
  dataloader.batch_size:
    values: [64, 128]
  regular.learning_rate:
    values: [0.0003, 0.003]
  separation.learning_rate:
    values: [0.0003, 0.003]
  separation.epochs:
    values: [1, 5]
  separation.pairs_per_layer:
    values: [8, 32]
  optimizer.type:
    values: [adamw]
  optimizer.weight_decay:
    values: [0.0001]
  regular.epochs:
    values: [12]
  wandb.mode:
    values: [online]
