dataset: cifar10
variant: layer123
seed: 0
device: auto
data_root: data

model:
  channels: [32, 64, 128, 256]
  kernel_size: 3
  dropout: 0.0

dataloader:
  batch_size: 128
  num_workers: 2
  pin_memory: true
  normalize: true

optimizer:
  type: adamw
  weight_decay: 0.0001

separation:
  learning_rate: 0.001
  epochs: 3
  steps_per_epoch: null
  pairs_per_layer: 16

regular:
  learning_rate: 0.001
  epochs: 12

variants:
  baseline: []
  layer1: [0]
  layer12: [0, 1]
  layer123: [0, 1, 2]
  layer1234: [0, 1, 2, 3]

checkpoint:
  enabled: true
  dir: checkpoints/separation

wandb:
  mode: online
  entity: null
  group: null
  tags: []
